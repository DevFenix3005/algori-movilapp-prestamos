[project]
name = "algori-movilapp-prestamos"
version = "0.1.0"
description = "App móvil préstamos en Kivy/KivyMD"
authors = [
    { name = "Roberto D. Cazarin", email = "robertodmngzczrn@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["kivy (>=2.3.1,<3.0.0)", "kivy-garden (>=0.1.5,<0.2.0)", "kivymd @ https://github.com/kivymd/KivyMD/archive/master.zip", "matplotlib (>=3.10.6,<4.0.0)"]

[tool.poetry]
packages = [
  { include = "algori_movilapp_prestamos", from = "src" }
]


[tool.poetry.group.dev.dependencies]
ruff = "^0.13.2"
pyclean = "^3.1.0"
pytest = "^8.4.2"
poethepoet = "^0.37.0"
coverage = "^7.10.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
clean = "pyclean . --debris --verbose --dry-run"

format_src = "ruff format ./src/"
format_test = "ruff format ./tests/"
format = ["format_src", "format_test"]

test = "pytest -q"
_gencov = "coverage run -m pytest -q"
_html = "coverage html"
cov = ["_gencov", "_html"]

_runApp = "python ./src/algori_movilapp_prestamos/main.py"
runApp = ["format", "_runApp"]

[tool.pytest.ini_options]
testpaths = ["tests"]